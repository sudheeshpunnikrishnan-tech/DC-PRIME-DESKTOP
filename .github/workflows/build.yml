name: Build DC Prime Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Desktop Scaffolding
        run: |
          flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Zip Artifact
        run: |
          powershell Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath DC_Prime_App.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DC_Prime_Windows_App
          path: DC_Prime_App.zip
