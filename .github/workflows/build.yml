name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Desktop Scaffolding
        run: flutter create --platforms=windows .

      - name: Apply Custom App Icon
        run: copy app_logo.ico windows\runner\resources\app_icon.ico

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Copy Required Visual C++ DLLs
        run: |
          $msvcDir = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
          $latestVersion = Get-ChildItem -Path$msvcDir | Sort-Object Name -Descending | Select-Object -First 1
          $x64Dir = Join-Path$latestVersion.FullName "x64"
          $crtDir = Get-ChildItem -Path$x64Dir -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          
          if ($crtDir) {
            Copy-Item -Path "$($crtDir.FullName)\*.dll" -Destination "build\windows\x64\runner\Release\" -Force
          }

      - name: Zip Artifact
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "SP_MultiBill_ERP_Windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SP-MultiBill-ERP-Release
          path: SP_MultiBill_ERP_Windows.zip
