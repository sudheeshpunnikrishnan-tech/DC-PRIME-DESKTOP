name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Desktop Scaffolding
        run: flutter create --platforms=windows --project-name=sp_multibill_erp .

      - name: Apply Custom App Icon
        run: copy app_logo.ico windows\runner\resources\app_icon.ico

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Copy Required Visual C++ DLLs
        run: |
          $targetDir = "build\windows\x64\runner\Release"
          copy C:\Windows\System32\msvcp140.dll $targetDir\
          copy C:\Windows\System32\vcruntime140.dll $targetDir\
          copy C:\Windows\System32\vcruntime140_1.dll $targetDir\

      - name: Zip Artifact
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath SPMultiBillERP_Windows_x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPMultiBillERP-Desktop-Release
          path: SPMultiBillERP_Windows_x64.zip
